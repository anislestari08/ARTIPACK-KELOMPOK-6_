<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Penjual — ARTIPACK!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>html { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- NAVBAR PENJUAL -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-extrabold tracking-tight">ARTIPACK! <span class="text-emerald-400 text-xs px-2 py-1 bg-slate-800 rounded-lg">Seller Dashboard</span></span>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold transition">
                <i class="fa-solid fa-store"></i> Kembali ke Toko
            </a>
        </div>
    </nav>

    <!-- KONTEN UTAMA -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full space-y-8">
        
        <!-- HEADER KONTROL -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900">Kelola Pesanan Masuk</h1>
                <p class="text-slate-500 text-xs mt-1">Data tersinkronisasi secara otomatis dari portal pembeli.</p>
            </div>
            <button onclick="loadOrders()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs flex items-center gap-2 transition">
                <i class="fa-solid fa-rotate"></i> Muat Ulang Data Cloud
            </button>
        </div>

        <!-- TABEL PESANAN MASUK -->
        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-extrabold text-slate-900 text-base"><i class="fa-solid fa-clipboard-list text-emerald-600"></i> Daftar Pesanan Pelanggan</h3>
                <span id="order-count" class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-3 py-1 rounded-full">0 Pesanan</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b">
                        <tr>
                            <th class="p-4">ID Pesanan</th>
                            <th class="p-4">Nama Pembeli</th>
                            <th class="p-4">Detail Pesanan</th>
                            <th class="p-4">Alamat & GPS</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-400">Memuat data pesanan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs">
        <p>&copy; 2026 ARTIPACK! Seller Center.</p>
    </footer>

    <!-- JAVASCRIPT KONEKSI JSONBIN UNTUK PENJUAL -->
    <script>
        const BIN_ID = "6abe317effd5d160534230c1";
        const API_KEY = "$2a$10$Z8DwuIumJefrLUkPOduwHOnKvPMbPU4rdLLuChaVG9xPsPm.1kyya";

        async function loadOrders() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Menghubungkan ke database cloud...</td></tr>`;
            
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let json = await res.json();
                let orders = json.record?.portal_penjual?.pesanan_masuk || [];

                document.getElementById('order-count').innerText = `${orders.length} Pesanan`;

                if (orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Belum ada pesanan masuk.</td></tr>`;
                    return;
                }

                tbody.innerHTML = orders.map((ord, idx) => `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-4 font-mono font-bold text-slate-900">${ord.id_pesanan || 'ORD-00'+idx}</td>
                        <td class="p-4 font-bold text-slate-800">${ord.nama_pembeli}</td>
                        <td class="p-4 text-slate-600 max-w-xs">${ord.detail_pesanan}</td>
                        <td class="p-4 text-slate-600 max-w-xs">${ord.alamat_pengiriman}</td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold ${ord.status_pesanan === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}">
                                ${ord.status_pesanan || 'Diproses'}
                            </span>
                        </td>
                        <td class="p-4 text-center space-x-1">
                            <button onclick="updateStatus(${idx}, 'Selesai')" class="bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg font-bold hover:bg-emerald-700">Selesai</button>
                            <button onclick="deleteOrder(${idx})" class="bg-rose-500 text-white px-2.5 py-1.5 rounded-lg font-bold hover:bg-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500">Gagal memuat data dari cloud. Periksa koneksi internet.</td></tr>`;
            }
        }

        async function updateStatus(index, newStatus) {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            let json = await res.json();
            let db = json.record;

            if (db?.portal_penjual?.pesanan_masuk[index]) {
                db.portal_penjual.pesanan_masuk[index].status_pesanan = newStatus;
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(db)
                });
                loadOrders();
            }
        }

        async function deleteOrder(index) {
            if (!confirm("Hapus pesanan ini?")) return;
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            let json = await res.json();
            let db = json.record;

            if (db?.portal_penjual?.pesanan_masuk) {
                db.portal_penjual.pesanan_masuk.splice(index, 1);
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(db)
                });
                loadOrders();
            }
        }

        window.onload = loadOrders;
    </script>
</body>
</html>
